<!-- Button: 4 variants × 3 sizes × 5 states. Requires tokens.css + system.css. -->
<button class="ds-btn ds-btn--primary">Create issue</button>
<button class="ds-btn ds-btn--secondary">Cancel</button>
<button class="ds-btn ds-btn--ghost">Ghost</button>
<button class="ds-btn ds-btn--danger">Delete</button>

<!-- sizes -->
<button class="ds-btn ds-btn--primary ds-btn--xs">xs 24</button>
<button class="ds-btn ds-btn--primary">sm 28</button>
<button class="ds-btn ds-btn--primary ds-btn--md">md 32</button>

<!-- states: real pseudo-classes are used in production; these force-render them in docs -->
<button class="ds-btn ds-btn--primary is-hover">hover</button>
<button class="ds-btn ds-btn--primary is-active">active</button>
<button class="ds-btn ds-btn--primary is-focus">focus</button>
<button class="ds-btn ds-btn--primary" disabled>disabled</button>
