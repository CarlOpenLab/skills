<!-- Checkbox, Switch, Status, Priority. -->
<label class="ds-check"><input type="checkbox" checked /><span class="box"><svg width="10" height="10"><use href="#i-check"/></svg></span>Create more</label>
<label class="ds-check"><input type="checkbox" /><span class="box"><svg width="10" height="10"><use href="#i-check"/></svg></span>Notify me</label>

<label class="ds-switch"><input type="checkbox" checked /><span class="track"></span>Enabled</label>
<label class="ds-switch"><input type="checkbox" /><span class="track"></span>Disabled</label>

<span class="ds-status"><i class="dot" style="background: var(--status-todo)"></i>Todo</span>
<span class="ds-status"><i class="dot" style="background: var(--status-progress)"></i>In Progress</span>
<span class="ds-status"><i class="dot" style="background: var(--status-done)"></i>Done</span>

<span class="ds-priority" style="color: var(--priority-medium)"><span class="prio-bars"><i></i><i></i><i></i></span>Medium</span>
